[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show local variables on failure, verbose by default
addopts =
    -v
    --tb=short
    --strict-markers
    -W default

# Markers (also registered in conftest.py)
markers =
    integration: end-to-end pipeline tests (slower)
    stage3: requires Stage 3 sub-minute data and TrueData feed
    stage4: requires Stage 4 dependencies (gymnasium, stable-baselines3, transformers)
    slow: tests that take more than 5 seconds

# Skip slow and stage3/4 markers by default in CI
# To run all: pytest --run-slow --run-stage3 --run-stage4
# Filter only known-harmless third-party deprecations.
# P1-FIX-40: All other warnings are shown by default (-W default above).
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google.rpc
